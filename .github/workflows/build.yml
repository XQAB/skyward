name: Build

# Every push is linted and tested, and the recovery is built for bixi — the
# one phone this fork hands images out for, see the devices job. A tag
# starting with v publishes those images as a release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      device:
        description: The codename of the one device to build for; every device when empty
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint what runs on the computer
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Lint what runs on the phone
        run: cargo ndk -t arm64-v8a --platform 30 clippy --locked -p skyward -p skyward-install -p skyward-systems -p skyward-system-init -- -D warnings

  tools:
    name: Build the recovery service and the packer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The version is compiled in: it is the number the phone shows in About
      # and the one it says it is when it asks for the next release. A release
      # carries the version its tag names, whether or not the branch it is cut
      # from has been numbered for it yet.
      - name: Take the version from the tag
        if: github.ref_type == 'tag'
        run: sed -i "s/^version = \"[^\"]*\"/version = \"${GITHUB_REF_NAME#v}\"/" Cargo.toml
      - name: Build the recovery service for the phone
        run: cargo ndk -t arm64-v8a --platform 30 build --release ${{ github.ref_type != 'tag' && '--locked' || '' }} -p skyward
      # It runs as a second system's first program, before any library is
      # there to load.
      - name: Build the second system's first program, static
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo ndk -t arm64-v8a --platform 30 build --release ${{ github.ref_type != 'tag' && '--locked' || '' }} -p skyward-system-init --target-dir target/system-init
      - name: Build the packer
        run: cargo build --release ${{ github.ref_type != 'tag' && '--locked' || '' }} -p skyward-pack
      # The built programs are staged in dist/, apart from the repository's own
      # tools/, which keeps the release checker and is copied out untouched.
      - name: Gather them
        run: |
          mkdir dist
          cp target/aarch64-linux-android/release/skyward target/release/skyward-pack dist/
          cp target/system-init/aarch64-linux-android/release/system-init dist/
      - uses: actions/upload-artifact@v7
        with:
          name: tools
          path: dist/
          if-no-files-found: error
          retention-days: 1

  devices:
    name: List the devices
    runs-on: ubuntu-24.04
    outputs:
      devices: ${{ steps.list.outputs.devices }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          if [ -n "$DEVICE" ]; then
            test -f "devices/$DEVICE.toml"
            echo "devices=$(jq -nc --arg device "$DEVICE" '[$device]')" >> "$GITHUB_OUTPUT"
          else
            # This fork hands out bixi alone. The other configurations stay in
            # devices/ for upstream comparison, but no image is built for a
            # phone this fork was never run on, so nobody flashes one by
            # mistake.
            echo 'devices=["bixi"]' >> "$GITHUB_OUTPUT"
          fi

  recovery:
    name: Recovery for ${{ matrix.device }}
    needs: [tools, devices]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.devices.outputs.devices) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: tools
          path: dist
      - name: Make the tools runnable
        run: chmod +x dist/skyward dist/skyward-pack
      - name: Read the stock build the recovery is made on
        id: stock
        run: dist/skyward-pack stock --config "devices/${{ matrix.device }}.toml" >> "$GITHUB_OUTPUT"
      - name: Restore the stock recovery
        id: cache
        uses: actions/cache@v6
        with:
          path: stock/recovery.img
          key: stock-recovery-${{ steps.stock.outputs.recovery }}
      # Only what the recovery partition takes is read of the package,
      # which is several gigabytes in all.
      - name: Take the recovery partition out of the stock package
        if: steps.cache.outputs.cache-hit != 'true'
        run: dist/skyward-pack stock --config "devices/${{ matrix.device }}.toml" --out stock/recovery.img
      - name: Check the stock recovery
        env:
          RECOVERY: ${{ steps.stock.outputs.recovery }}
        run: echo "$RECOVERY  stock/recovery.img" | sha256sum --check
      - name: Pack the recovery
        id: pack
        env:
          DEVICE: ${{ matrix.device }}
          STOCK: ${{ steps.stock.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; else version="${GITHUB_SHA::7}"; fi
          name="skyward-$version-$DEVICE-$STOCK"
          mkdir out
          # A phone whose own vendor programs need libraries the stock recovery
          # does not carry keeps them in <codename>_extra/, laid out as the
          # recovery's own root; they go into the image along with the binary.
          extra=()
          if [ -d "${DEVICE}_extra" ]; then extra=(--extra "${DEVICE}_extra"); fi
          dist/skyward-pack recovery --stock stock/recovery.img --binary dist/skyward --system-init dist/system-init \
            --config "devices/$DEVICE.toml" --font resources/fonts/MiSansVF.ttf --mono resources/fonts/KirkMono-Regular.ttf \
            --mono-license resources/fonts/KirkMono-OFL.txt "${extra[@]}" --out "out/$name.img"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      # The image is read back the way the bootloader reads it — header, ramdisk
      # framing, the archive's entries — so a build that quietly lost a vendor
      # file or a command link fails here and not on the phone.
      - name: Check what was packed
        env:
          DEVICE: ${{ matrix.device }}
          NAME: ${{ steps.pack.outputs.name }}
        run: |
          extra=()
          if [ -d "${DEVICE}_extra" ]; then extra=(--extra "${DEVICE}_extra"); fi
          version=()
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=(--version "${GITHUB_REF_NAME#v}"); fi
          python3 tools/verify-release.py "out/$NAME.img" --config "devices/$DEVICE.toml" \
            --report "out/$NAME.verify.txt" "${extra[@]}" "${version[@]}"
      # The image is the whole partition, flashed as it is, and most of it
      # is the room the recovery leaves empty; it is handed out zipped.
      - name: Zip the image
        working-directory: out
        env:
          NAME: ${{ steps.pack.outputs.name }}
        run: zip -9 "$NAME.zip" "$NAME.img"
      # Both of them: the zip people unzip, and the bare partition image that
      # Skyward's own updater takes first when it asks GitHub for a release.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.name }}
          path: |
            out/${{ steps.pack.outputs.name }}.img
            out/${{ steps.pack.outputs.name }}.zip
            out/${{ steps.pack.outputs.name }}.verify.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: [check, recovery]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The devices' configurations say which phone each zip is for.
      - uses: actions/checkout@v7
      # Each artifact is the image and its zip, which the download keeps whole
      # under their names, as they are handed out.
      - uses: actions/download-artifact@v8
        with:
          pattern: skyward-*
          path: images
          merge-multiple: true
      - name: Sum what is handed out
        working-directory: images
        run: sha256sum -- *.img *.zip > SHA256SUMS
      # Each zip shows on the release as the phone it is for, its model and
      # then its codename, which is how people look for theirs; a device
      # whose zip is missing stops the release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=()
          for config in devices/bixi.toml; do
            device=$(basename "$config" .toml)
            model=$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["device"]["model"])' "$config")
            img=$(ls images/skyward-"$GITHUB_REF_NAME"-"$device"-*.img)
            zip=$(ls images/skyward-"$GITHUB_REF_NAME"-"$device"-*.zip)
            report=$(ls images/skyward-"$GITHUB_REF_NAME"-"$device"-*.verify.txt)
            assets+=("$img#$model ($device) - image")
            assets+=("$zip#$model ($device) - zip")
            assets+=("$report#$model ($device) - verification report")
          done
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes "${assets[@]}" images/SHA256SUMS
