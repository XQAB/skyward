name: Mirror watch

# The update page hands its downloads to one of five mirrors. A mirror that
# quietly stops answering looks on the phone exactly like a bad network, and
# nobody finds out until someone tries to update over it. So once a day,
# tools/mirror-watch.py asks each one the same two questions — does it still
# carry GitHub's API, does it still hand out the newest asset — writes the
# table here, and opens an issue when one goes away.
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  probe:
    name: Ask each mirror
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Ask each mirror whether it still answers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh label create mirror-watch --description "加速源探活" --color B60205 2>/dev/null || true
          python3 tools/mirror-watch.py --report "$RUNNER_TEMP/mirror-report.md" --file-issue
          if [ -f "$RUNNER_TEMP/mirror-report.md" ]; then
            cat "$RUNNER_TEMP/mirror-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
